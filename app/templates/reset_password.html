{% extends "base.html" %}

{% block title %}Установка нового пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4><i class="bi bi-key"></i> Новый пароль</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Введите код из письма и новый пароль.</p>
                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email"
                               value="{{ request.query_params.get('email', '') }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="code" class="form-label">Код из письма</label>
                        <input type="text" class="form-control" id="code" placeholder="Введите 6-значный код" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Новый пароль</label>
                        <input type="password" class="form-control" id="newPassword" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-check-circle"></i> Сменить пароль
                    </button>
                </form>
                <div id="messageContainer" class="mt-3"></div>
                <hr>
                <div class="text-center">
                    <a href="/pages/login">Вернуться к входу</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('code').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const msgContainer = document.getElementById('messageContainer');

    if (!email || !code || !newPassword || !confirmPassword) {
        msgContainer.innerHTML = `<div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> Заполните все поля
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
        return;
    }
    if (newPassword !== confirmPassword) {
        msgContainer.innerHTML = `<div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-x-circle-fill me-2"></i> Пароли не совпадают
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
        return;
    }
    if (newPassword.length < 6) {
        msgContainer.innerHTML = `<div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i> Пароль должен быть не менее 6 символов
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
        return;
    }

    msgContainer.innerHTML = `<div class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-hourglass-split me-2"></i> Проверка кода...
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;

    try {
        const response = await fetch('/auth/verify-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code, new_password: newPassword })
        });
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.detail || `Ошибка сервера: ${response.status}`);
        }
        const data = await response.json();
        msgContainer.innerHTML = `
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> ${data.message || 'Пароль успешно изменён'}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
        setTimeout(() => {
            window.location.href = '/pages/login';
        }, 2000);
    } catch (error) {
        console.error('Ошибка:', error);
        msgContainer.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                ${error.message || 'Произошла ошибка'}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
    }
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4><i class="bi bi-envelope"></i> Восстановление пароля</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Введите ваш email, и мы отправим код для сброса пароля.</p>
                <form id="resetRequestForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" value="admin@crm.local" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">
                        <i class="bi bi-send"></i> Отправить код
                    </button>
                </form>
                <div id="messageContainer" class="mt-3"></div>
                <hr>
                <div class="text-center">
                    <a href="/pages/login">Вернуться к входу</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('resetRequestForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const msgContainer = document.getElementById('messageContainer');

    msgContainer.innerHTML = `<div class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-hourglass-split me-2"></i> Отправка запроса...
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;

    try {
        const response = await fetch('/auth/request-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.detail || `Ошибка сервера: ${response.status}`);
        }
        const data = await response.json();
        msgContainer.innerHTML = `
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> ${data.message || 'Код отправлен на вашу почту'}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
        const emailParam = encodeURIComponent(email);
        setTimeout(() => {
            window.location.href = `/pages/reset-password?email=${emailParam}`;
        }, 2000);
    } catch (error) {
        console.error('Ошибка:', error);
        msgContainer.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                ${error.message || 'Произошла ошибка при отправке запроса'}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
    }
});
</script>
{% endblock %}

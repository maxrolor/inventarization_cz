{% extends "base.html" %}

{% block title %}Вход администратора{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="bi bi-shield-lock"></i> Администратор</h4>
            </div>
            <div class="card-body">
                <form action="/auth/login-web" method="post" autocomplete="off">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Введите имя" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Введите пароль" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                </form>
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                <hr>
                <div class="text-center">
                    <a href="/pages/forgot-password">Забыли пароль?</a>
                </div>
                <div class="text-center mt-2">
                    <a href="/">На главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

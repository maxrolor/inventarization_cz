{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow">
            <div class="card-body py-5">
                <i class="bi bi-question-circle display-1 text-warning"></i>
                <h1 class="mt-3">404</h1>
                <h4 class="text-muted">Страница не найдена</h4>
                <p class="text-muted">Возможно, адрес был изменён или страница удалена.</p>
                <a href="/" class="btn btn-primary mt-3">Вернуться на главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

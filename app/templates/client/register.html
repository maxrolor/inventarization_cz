{% extends "base.html" %}

{% block title %}Регистрация клиента{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-person-plus"></i> Регистрация клиента</h4>
                </div>
                <div class="card-body">
                    <form id="register-form">
                        <!-- поля как раньше, но убираем method и action -->
                        <div class="mb-3">
                            <label for="inn" class="form-label">ИНН <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="inn" name="inn" 
                                       placeholder="Введите 10 или 12 цифр" 
                                       pattern="[0-9]{10,12}" maxlength="12" required>
                                <button class="btn btn-outline-secondary" type="button" id="parse-inn-btn">
                                    <i class="bi bi-search"></i> Заполнить по ИНН
                                </button>
                            </div>
                            <div id="inn-feedback" class="invalid-feedback"></div>
                            <small class="text-muted">Нажмите "Заполнить по ИНН" для автозаполнения данных из ФНС</small>
                        </div>

                        <div class="mb-3">
                            <label for="company_name" class="form-label">Название организации</label>
                            <input type="text" class="form-control" id="company_name" name="company_name" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="ceo_name" class="form-label">Руководитель</label>
                            <input type="text" class="form-control" id="ceo_name" name="ceo_name" readonly>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="client_type" class="form-label">Тип клиента</label>
                                <select class="form-select" id="client_type" name="client_type">
                                    <option value="individual">ИП</option>
                                    <option value="legal" selected>ООО / АО</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="kpp" class="form-label">КПП (для юрлиц)</label>
                                <input type="text" class="form-control" id="kpp" name="kpp" readonly>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 (XXX) XXX-XX-XX">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                            <div class="form-text">Минимум 6 символов</div>
                        </div>

                        <div class="mb-3">
                            <label for="addresses" class="form-label">Адреса (каждый с новой строки)</label>
                            <textarea class="form-control" id="addresses" name="addresses" rows="3" 
                                      placeholder="г. Москва, ул. Тверская, д. 1"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="/client/login">Уже есть аккаунт? Войти</a>
                    </div>
                    <div id="parse-result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const innInput = document.getElementById('inn');
        const parseBtn = document.getElementById('parse-inn-btn');
        const resultDiv = document.getElementById('parse-result');
        const form = document.getElementById('register-form');

        // Парсинг ИНН
        parseBtn.addEventListener('click', async function() {
            const inn = innInput.value.trim();
            if (!inn) {
                showResult('danger', 'Введите ИНН');
                return;
            }
            if (!/^\d{10,12}$/.test(inn)) {
                showResult('danger', 'ИНН должен содержать 10 или 12 цифр');
                return;
            }

            parseBtn.disabled = true;
            parseBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Загрузка...';

            try {
                const response = await fetch(`/client/parse-inn?inn=${encodeURIComponent(inn)}`);
                const data = await response.json();

                if (response.ok) {
                    if (data.name) document.getElementById('company_name').value = data.name;
                    if (data.ceo_name) document.getElementById('ceo_name').value = data.ceo_name;
                    if (data.type) {
                        document.getElementById('client_type').value = data.type === 'legal' ? 'legal' : 'individual';
                    }
                    if (data.kpp) document.getElementById('kpp').value = data.kpp;
                    showResult('success', 'Данные успешно загружены');
                } else {
                    showResult('danger', data.detail || 'Ошибка при загрузке данных по ИНН');
                }
            } catch (err) {
                showResult('danger', 'Ошибка сети: ' + err.message);
            } finally {
                parseBtn.disabled = false;
                parseBtn.innerHTML = '<i class="bi bi-search"></i> Заполнить по ИНН';
            }
        });

        function showResult(type, message) {
            resultDiv.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
        }

        // Отправка формы через fetch (JSON)
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Собрать данные
            const inn = document.getElementById('inn').value.trim();
            const company_name = document.getElementById('company_name').value.trim();
            const ceo_name = document.getElementById('ceo_name').value.trim();
            const client_type = document.getElementById('client_type').value;
            const kpp = document.getElementById('kpp').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const addressesText = document.getElementById('addresses').value.trim();
            const addresses = addressesText ? addressesText.split('\n').map(s => s.trim()).filter(s => s) : [];

            // Валидация
            if (!inn || !email || !password) {
                showResult('danger', 'Заполните ИНН, Email и пароль');
                return;
            }
            if (password.length < 6) {
                showResult('danger', 'Пароль должен быть не менее 6 символов');
                return;
            }

            const payload = {
                inn,
                name: company_name,
                ceo_name,
                type: client_type,
                kpp,
                email,
                phone,
                password,
                addresses
            };

            try {
                const response = await fetch('/client/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('success', 'Регистрация успешна! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = '/client/login';
                    }, 1500);
                } else {
                    let errorMsg = data.detail || 'Ошибка регистрации';
                    if (typeof errorMsg === 'object') {
                        errorMsg = Object.values(errorMsg).flat().join(', ');
                    }
                    showResult('danger', errorMsg);
                }
            } catch (err) {
                showResult('danger', 'Ошибка сети: ' + err.message);
            }
        });
    });
</script>
{% endblock %}

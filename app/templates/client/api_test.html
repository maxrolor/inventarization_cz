<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тестирование API Честного знака</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Тестирование API ЧЗ</h1>
    <hr>
    <div class="row">
        <div class="col-md-6">
            <h3>Остатки (<code>/balances</code>)</h3>
            <button id="btnBalances" class="btn btn-primary">Получить остатки</button>
            <pre id="resultBalances" class="mt-2"></pre>
        </div>
        <div class="col-md-6">
            <h3>Поиск марок (<code>/marks/search</code>)</h3>
            <div class="mb-2">
                <label>Группа товаров (через запятую):</label>
                <input id="productGroups" class="form-control" value="milk">
            </div>
            <button id="btnSearch" class="btn btn-primary">Поиск</button>
            <pre id="resultSearch" class="mt-2"></pre>
        </div>
    </div>
</div>
<script>
    function apiRequest(url, method, body = null) {
        const options = {
            method: method,
            headers: { 'Content-Type': 'application/json' }
        };
        if (body) options.body = JSON.stringify(body);
        return fetch(url, options).then(r => r.json());
    }

    document.getElementById('btnBalances').addEventListener('click', function() {
        document.getElementById('resultBalances').textContent = 'Загрузка...';
        apiRequest('/balances', 'GET')
            .then(data => document.getElementById('resultBalances').textContent = JSON.stringify(data, null, 2))
            .catch(err => document.getElementById('resultBalances').textContent = 'Ошибка: ' + err);
    });

    document.getElementById('btnSearch').addEventListener('click', function() {
        const groups = document.getElementById('productGroups').value.split(',').map(s => s.trim());
        document.getElementById('resultSearch').textContent = 'Загрузка...';
        apiRequest('/marks/search', 'POST', { product_groups: groups, per_page: 10 })
            .then(data => document.getElementById('resultSearch').textContent = JSON.stringify(data, null, 2))
            .catch(err => document.getElementById('resultSearch').textContent = 'Ошибка: ' + err);
    });
</script>
</body>
</html>
